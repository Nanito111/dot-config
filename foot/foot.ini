# -*- conf -*-
# config template: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
# config manual: https://man.archlinux.org/man/foot.ini.5.en

term=xterm-256color

font=GoMono Nerd Font:size=13
horizontal-letter-offset=0
vertical-letter-offset=0
box-drawings-uses-font-glyphs=no
dpi-aware=yes

initial-window-size-pixels=1000x900  # Or,
pad=0x7 center       # optionally append 'center'

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode
protocols=http, https, ftp, ftps, file, gemini, gopher
uri-characters=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_.,~:;/?#@!$&%*+="'()[]


[mouse]
hide-when-typing=yes

# Rose-Piné Dawn (By cement-drinker)
# [cursor]
# color=faf4ed 575279

# gruvbox-dark
[colors]
# alpha=1.0
background=1D2021
foreground=ebdbb2
regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984
bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2


[key-bindings]
spawn-terminal=none

[url-bindings]
cancel=Control+g Control+c Control+d Escape
toggle-url-visible=t

