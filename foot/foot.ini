# -*- conf -*-
# config template: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
# config manual: https://man.archlinux.org/man/foot.ini.5.en

[main]
include=/home/francisco/.config/foot/colors.ini

term=xterm-256color

font=Hurmit Nerd Font:size=12, Noto Color Emoji:size=12
horizontal-letter-offset=0
vertical-letter-offset=0
box-drawings-uses-font-glyphs=no
# dpi-aware=yes

# initial-window-size-pixels=500x500
pad=10x10 center       # optionally append 'center'

[mouse]
hide-when-typing=yes

[cursor]
blink=yes

[key-bindings]
spawn-terminal=none
scrollback-up-page=Mod1+Shift+u
scrollback-down-page=Mod1+Shift+d
scrollback-up-line=Mod1+Shift+k
scrollback-down-line=Mod1+Shift+j

[search-bindings]
find-prev=Control+p
find-next=Control+n

[url-bindings]
cancel=Control+g Control+c Control+d Escape
toggle-url-visible=t

# vim: ft=dosini
