# BACKGROUND
background {
    path = ~/.config/hypr/wallpaper-lockscreen

    # options for path=screenshot
    # blur_passes = 4
    # blur_size = 25
    # brightness = 0.7
}

# GENERAL
general {
    ignore_empty_input = true
    hide_cursor = false
}


# ====== RIGHT BOX ======

# ========= Date-Month =========
shape {
    size = 190, 30
    color = rgb(000000)
    rounding = 0
    border_size = 0

    position = 0, 150
    halign = center
    valign = center
}
label {
    text = cmd[update:1000] date +'%B' | tr '[:lower:]' '[:upper:]'
    color = rgb(878580)
    font_size = 20
    font_family = Nimbus Mono PS
    text_align = center
    position = 0, 146
    halign = center
    valign = center
}

# ========= DAY =========
shape {
    size = 275, 45
    color = rgb(000000)
    rounding = 0
    border_size = 0

    position = 0, 107
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +'%d %A' | tr '[:lower:]' '[:upper:]'
    color = rgb(878580)
    font_size = 26
    font_family = Nimbus Mono PS
    text_align = center
    position = 0, 100
    halign = center
    valign = center
}

# ========= Time =========
shape {
    size = 480, 80
    color = rgb(000000)
    rounding = 0
    border_size = 0

    position = 0, 40
    halign = center
    valign = center
}

label {
    # text = cmd[update:1000] echo $TIME
    text = cmd[update:1000] date +'%H:%M:%S'
    color = rgb(CECDC3)
    font_size = 70
    font_family = Nimbus Mono PS Bold
    text_align = center
    position = 5, 23
    halign = center
    valign = center
}

