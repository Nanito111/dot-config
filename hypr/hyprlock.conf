# INPUT FIELD
input-field {
    size = 400, 80
    outline_thickness = 0
    rounding = 0
    # outer_color = rgba(255,255,255,1)
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,1)

    swap_font_color = true
    font_color = rgb(CECDC3)
    check_color = rgb(878580)
    fail_color = rgb(D14D41)
    # dots_text_format = <span>*</span>
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.4 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    hide_input = false
    position = 0, 20
    halign = center
    valign = bottom

    font_family = Nimbus Mono PS
    placeholder_text = <span> type password </span>
    fail_text = <span> fail to unlock </span>
}
