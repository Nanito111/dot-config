# BACKGROUND
background {
    monitor =
    # path = ~/.config/hypr/hyprlock.png
    # blur_passes = 0
    # contrast = 0.8916
    # brightness = 0.8172
    # vibrancy = 0.1696
    # vibrancy_darkness = 0.0
}

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}


# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgb(EBDBB2)
    font_size = 90
    font_family = Noto Serif Display
    position = 0, 200
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgb(EBDBB2)
    font_size = 40
    font_family = Noto Serif Display
    position = 0, 100
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo $TIME
    # text = cmd[update:1000] echo "<span>$(date +"- %H:%M -")</span>"
    color = rgb(EBDBB2)
    font_size = 24
    # font_family = GoMono Nerd Font
    font_family = Noto Serif Display
    position = 0, 40
    halign = center
    valign = center
}


# INPUT FIELD
input-field {
    monitor =

    size = 300, 60
    outline_thickness = 0
    rounding = 0
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0)

    swap_font_color = true
    font_color = rgb(EBDBB2)
    check_color = rgb(FABD2F)
    fail_color = rgb(FB4934)

    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = 3

    fade_on_empty = false
    hide_input = false
    position = 0, -90
    halign = center
    valign = center

    fail_timeout = 1000
    font_family = GoMono Nerd Font
    placeholder_text = <span> 󰌾 </span>
    fail_text = <span> 󱙱 </span>
}
