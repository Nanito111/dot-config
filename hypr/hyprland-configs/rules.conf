########################################## WINDOWS ##########################################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = noblur, class:^(?!(zen|foot))$

# checkupdates
windowrule = workspace special:magic, initialTitle:^System Update$, initialClass:^foot$
windowrule = pseudo                 , initialTitle:^System Update$, initialClass:^foot$
windowrule = size 1064 902          , initialTitle:^System Update$, initialClass:^foot$

# postman save file
windowrule = float       ,initialClass:^postman$, initialTitle:^Select path to save file$
windowrule = size 900 600,initialClass:^postman$, initialTitle:^Select path to save file$

# postman open file
windowrule = float       ,initialClass:^postman$, initialTitle:^Open Files$
windowrule = size 900 600,initialClass:^postman$, initialTitle:^Open Files$

# for some reason now this is the postman 'open files' window
windowrule = float       ,initialClass:^xdg-desktop-portal-gtk$, initialTitle:^Open Files$
windowrule = size 900 600,initialClass:^xdg-desktop-portal-gtk$, initialTitle:^Open Files$

# signal open file
windowrule = float       ,initialClass:^signal-desktop$, initialTitle:^Open Files$
windowrule = size 900 600,initialClass:^signal-desktop$, initialTitle:^Open Files$

# slack open file
windowrule = float       ,initialClass:^slack$, initialTitle:^Open Files$
windowrule = size 900 600,initialClass:^slack$, initialTitle:^Open Files$

# slack
windowrule = noscreenshare,initialClass:Slack, initialTitle:Slack, class:Slack

# bitwarden
windowrule = noscreenshare, initialClass:Bitwarden, initialTitle:Bitwarden, class:Bitwarden, title:Bitwarden

# thunar rename
windowrule = float       , initialClass:thunar, initialTitle:^Rename \".+\"$
windowrule = size 500 200, initialClass:thunar, initialTitle:^Rename \".+\"$


# zen picture in picture
windowrule = float          , initialClass:zen, initialTitle:Picture-in-Picture
windowrule = keepaspectratio, initialClass:zen, initialTitle:Picture-in-Picture
windowrule = noanim         , initialClass:zen, initialTitle:Picture-in-Picture
windowrule = norounding     , initialClass:zen, initialTitle:Picture-in-Picture
windowrule = size 1280 720  , initialClass:zen, initialTitle:Picture-in-Picture

# game rules
windowrule = monitor HDMI-A-1,class:^steam_app_\d+$
windowrule = workspace 5,class:^steam_app_\d+$
windowrule = content game, class:^steam_app_\d+$
windowrule = opaque, class:^steam_app_\d+$
windowrule = noanim, class:^steam_app_\d+$
windowrule = immediate, class:^steam_app_\d+$

windowrule = monitor HDMI-A-1, class:gamescope
windowrule = workspace 5, class:gamescope
windowrule = content game, class:gamescope
windowrule = opaque, class:gamescope
windowrule = noanim, class:gamescope
windowrule = immediate, class:gamescope

########################################## WORKSPACES ##########################################
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# workspace for games
workspace = 5, monitor:HDMI-A-1, border:false, rounding:false, decorate:false, shadow:false, persistent:false, gapsin:0, gapsout:0

# regular workspaces
workspace = 1,  monitor:HDMI-A-1, default:true, persistent:true
workspace = 2,  monitor:HDMI-A-1, persistent:true
workspace = 3,  monitor:HDMI-A-1, persistent:true
workspace = 4,  monitor:HDMI-A-1, persistent:true
workspace = 7,  monitor:DVI-D-1,  default:true, persistent:true
workspace = 8,  monitor:DVI-D-1,  persistent:true
workspace = 9,  monitor:DVI-D-1,  persistent:true
workspace = 10, monitor:DVI-D-1,  persistent:true

########################################## LAYERS ##########################################
# See https://wiki.hypr.land/Configuring/Window-Rules/#layer-rules for layer rules

# hyprshot
layerrule = noanim, hyprpicker
layerrule = noanim, selection

# astal
layerrule = blur           , ^astal-\w+-blur$
layerrule = ignorealpha 0.1, ^astal-\w+-blur$
layerrule = animation fade , ^astal-\w+-blur$

layerrule = noanim, astal-bar

layerrule = abovelock true, astal-notification-blur
layerrule = abovelock false, astal-osd
layerrule = animation fade, astal-osd

# fuzzel
layerrule = blur           , launcher
layerrule = ignorealpha 0.1, launcher
layerrule = animation popin, launcher

# hyprpaper
layerrule = animation fade, hyprpaper
