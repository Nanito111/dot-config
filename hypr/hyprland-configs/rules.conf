########################################## WINDOWS ##########################################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Global
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float on 1, match:fullscreen 0, match:pin 0, no_focus on
windowrule = match:class negative:(zen$|thunar$|Thunar$), no_blur on

# checkupdates (foot)
windowrule = match:initial_title ^System Update$, match:initial_class ^foot$, workspace special:magic
windowrule = match:initial_title ^System Update$, match:initial_class ^foot$, pseudo on
windowrule = match:initial_title ^System Update$, match:initial_class ^foot$, size 1064 902

# postman save file
windowrule = match:initial_class ^postman$, match:initial_title ^Select path to save file$, float on
windowrule = match:initial_class ^postman$, match:initial_title ^Select path to save file$, size 900 600

# postman open file
windowrule = match:initial_class ^postman$, match:initial_title ^Open Files$, float on
windowrule = match:initial_class ^postman$, match:initial_title ^Open Files$, size 900 600

# xdg-desktop-portal-gtk open file
windowrule = match:initial_class ^xdg-desktop-portal-gtk$, match:initial_title ^Open Files$, float on
windowrule = match:initial_class ^xdg-desktop-portal-gtk$, match:initial_title ^Open Files$, size 900 600

# signal open file
windowrule = match:initial_class ^signal-desktop$, match:initial_title ^Open Files$, float on
windowrule = match:initial_class ^signal-desktop$, match:initial_title ^Open Files$, size 900 600

# slack open file
windowrule = match:initial_class ^slack$, match:initial_title ^Open Files$, float on
windowrule = match:initial_class ^slack$, match:initial_title ^Open Files$, size 900 600

# slack main window
windowrule = match:initial_class Slack, match:initial_title Slack, match:class Slack, no_screen_share on

# bitwarden
windowrule = match:initial_class Bitwarden, match:initial_title Bitwarden, match:class Bitwarden, match:title Bitwarden, no_screen_share on

# thunar rename
windowrule = match:initial_class thunar, match:initial_title ^Rename \".+\"$, float on
windowrule = match:initial_class thunar, match:initial_title ^Rename \".+\"$, size 500 200

# dbeaver splash image
windowrule = match:initial_class java, match:initial_title Dbeaver, float on
windowrule = match:initial_class java, match:initial_title Dbeaver, size 600 300
windowrule = match:initial_class java, match:initial_title Dbeaver, keep_aspect_ratio on
windowrule = match:initial_class java, match:initial_title Dbeaver, center on
windowrule = match:initial_class java, match:initial_title Dbeaver, border_size 0

# zen picture in picture
windowrule = match:initial_class zen, match:initial_title Picture-in-Picture, float on
windowrule = match:initial_class zen, match:initial_title Picture-in-Picture, keep_aspect_ratio on
windowrule = match:initial_class zen, match:initial_title Picture-in-Picture, no_anim on
windowrule = match:initial_class zen, match:initial_title Picture-in-Picture, rounding 0
windowrule = match:initial_class zen, match:initial_title Picture-in-Picture, size 1280 720

# waterfox picture in picture
windowrule = match:initial_class waterfox, match:initial_title Picture-in-Picture, float on
windowrule = match:initial_class waterfox, match:initial_title Picture-in-Picture, keep_aspect_ratio on
windowrule = match:initial_class waterfox, match:initial_title Picture-in-Picture, no_anim on
windowrule = match:initial_class waterfox, match:initial_title Picture-in-Picture, rounding 0
windowrule = match:initial_class waterfox, match:initial_title Picture-in-Picture, size 1280 720

# game rules (steam)
windowrule = match:class ^steam_app_\d+$, monitor HDMI-A-1
windowrule = match:class ^steam_app_\d+$, workspace 5
windowrule = match:class ^steam_app_\d+$, content game
windowrule = match:class ^steam_app_\d+$, opaque on
windowrule = match:class ^steam_app_\d+$, no_anim on
windowrule = match:class ^steam_app_\d+$, immediate on
# windowrule = match:class ^steam_app_\d+$, fullscreen_state 2 2

# gamescope
windowrule = match:class gamescope, monitor HDMI-A-1
windowrule = match:class gamescope, workspace 5
windowrule = match:class gamescope, content game
windowrule = match:class gamescope, opaque on
windowrule = match:class gamescope, no_anim on
windowrule = match:class gamescope, immediate on
# windowrule = match:class gamescope, fullscreen_state 2 2

########################################## WORKSPACES ##########################################
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# workspace for games
workspace = 5, monitor:HDMI-A-1, border:false, rounding:false, decorate:false, shadow:false, persistent:false, gapsin:0, gapsout:0

# regular workspaces
workspace = 1,  monitor:HDMI-A-1, default:true, persistent:true
workspace = 2,  monitor:HDMI-A-1, persistent:true
workspace = 3,  monitor:HDMI-A-1, persistent:true
workspace = 4,  monitor:HDMI-A-1, persistent:true
workspace = 7,  monitor:DVI-D-1,  default:true, persistent:true
workspace = 8,  monitor:DVI-D-1,  persistent:true
workspace = 9,  monitor:DVI-D-1,  persistent:true
workspace = 10, monitor:DVI-D-1,  persistent:true

########################################## LAYERS ##########################################
# See https://wiki.hypr.land/Configuring/Window-Rules/#layer-rules for layer rules

# hyprshot
layerrule = match:namespace hyprpicker, no_anim on
layerrule = match:namespace selection, no_anim on

# fuzzel
layerrule = match:namespace launcher, blur on
layerrule = match:namespace launcher, ignore_alpha 0.8

# hyprpaper
layerrule = match:namespace hyprpaper, animation fade
