###################
### KEYBINDINGS ###
###################

binds {
  scroll_event_delay = false
}

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, exec, uwsm app -- $terminal
bind = $mainMod, Y, exec, /.config/hypr/checkupdates.fish
bind = $mainMod SHIFT, C, exec, uwsm app -- $colorPicker

# screenshot binds
bind = $mainMod, S, exec, uwsm app -- $screenshot-region
bind = $mainMod SHIFT, S, exec, uwsm app -- $screenshot-window
bind = $mainMod LEFT_CONTROL, S, exec, uwsm app -- $screenshot-monitor

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, escape, exit,
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, uwsm app -- $appLauncher
bind = $mainMod, G, pseudo, # dwindle
bind = $mainMod, F, togglesplit, # dwindle

# system binds
bind = $mainMod, P, exec, uwsm app -- hyprlock
bind = $mainMod SHIFT, P, exec, systemctl suspend

# Move focus with mainMod + vim move keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window with mainMod shift + vim move keys
bind = $mainMod shift, H, movewindow, l
bind = $mainMod shift, L, movewindow, r
bind = $mainMod shift, K, movewindow, u
bind = $mainMod shift, J, movewindow, d

# Move floting window with mainMod left-control + vim move keys
$move_amount = 30
binde = $mainMod LEFT_CONTROL, H, moveactive, -$move_amount 0
binde = $mainMod LEFT_CONTROL, L, moveactive, $move_amount 0
binde = $mainMod LEFT_CONTROL, K, moveactive, 0 -$move_amount
binde = $mainMod LEFT_CONTROL, J, moveactive, 0 $move_amount

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod SHIFT, A, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = $mainMod SHIFT, N, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+
bindel = $mainMod SHIFT, B, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-
bindel = $mainMod SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = $mainMod, N, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, B, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Zoom stuff
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor `hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}'`
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor `hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}'`
bind = $mainMod, mouse:274, exec, hyprctl -q keyword cursor:zoom_factor 1

