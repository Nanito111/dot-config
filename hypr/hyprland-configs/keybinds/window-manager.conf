bind = $mainMod, Q, killactive
bind = $mainMod, F, togglefloating
bind = $mainMod, G, pseudo # dwindle
bind = $mainMod, X, layoutmsg, togglesplit # dwindle
bind = $mainMod, F11, fullscreenstate, 2 2

# move focus with mainMod + vim move keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# move window with mainMod shift + vim move keys
bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d

# move/resize windows with $mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# switch workspaces with mainMod + [0-9] except 6
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# scroll through existing workspaces in monitor with mainMod + scroll
bind = $mainMod LEFT_CONTROL, H, workspace, m-1
bind = $mainMod LEFT_CONTROL, L, workspace, m+1

bind = $mainMod LEFT_CONTROL, mouse_down, workspace, m-1
bind = $mainMod LEFT_CONTROL, mouse_up, workspace, m+1

# move active window to a workspace with mainMod + SHIFT + [0-9] except 6
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT LEFT_CONTROL, H, movetoworkspace, m-1
bind = $mainMod SHIFT LEFT_CONTROL, L, movetoworkspace, m+1

# special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod SHIFT, A, movetoworkspace, special:magic

# windows groups
bind = $mainMod, T, togglegroup
bind = $mainMod SHIFT, T, lockactivegroup, toggle
# change tabs
bindel = $mainMod ALT, L, changegroupactive, f
bind = $mainMod ALT, mouse_up, changegroupactive, f
bindel = $mainMod ALT, H, changegroupactive, b
bind = $mainMod ALT, mouse_down, changegroupactive, b
