# system binds
bind = $mainMod, P, exec, uwsm app -- hyprlock
bind = $mainMod SHIFT, P, exec, pc-suspend
bind = $mainMod SHIFT, escape, exec, pc-logout

# laptop multimedia keys for volume and LCD brightness
# volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = $mainMod SHIFT, N, exec, $change_volume DEFAULT_AUDIO_SOURCE "+"
bindel = $mainMod SHIFT, B, exec, $change_volume DEFAULT_AUDIO_SOURCE "-"
bindel = $mainMod SHIFT, M, exec, $change_volume DEFAULT_AUDIO_SOURCE "mute"

bindel = $mainMod, N, exec, $change_volume DEFAULT_AUDIO_SINK "+"
bindel = $mainMod, B, exec, $change_volume DEFAULT_AUDIO_SINK "-"
bindel = $mainMod, M, exec, $change_volume DEFAULT_AUDIO_SINK "mute"
# brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# zoom stuff
bind = $mainMod, mouse_down, exec, $change_zoom "1.2"
bind = $mainMod, mouse_up  , exec, $change_zoom "0.8"
bind = $mainMod, mouse:274 , exec, hyprctl -q keyword cursor:zoom_factor 1
