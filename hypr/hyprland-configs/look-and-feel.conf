#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4,8,4,8

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(FFFCF02f)
    col.inactive_border = rgba(000000a1)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 8
        sharp = false
        offset = 0, 0
        color = rgba(0000007A)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        new_optimizations = true
        ignore_opacity = true
        xray = false
        size = 5
        passes = 2
        brightness = 0.6
        noise = 0.07
    }
}

# blur layers
layerrule = blur, gtk-layer-shell
layerrule = ignorealpha 0.1, gtk-layer-shell
layerrule = blur, launcher
layerrule = ignorealpha 0.1, launcher

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = easeOutBack,0.68,-0.55,0.265,1.55
    bezier = easeInBack,0.6,-0.28,0.735,0.045
    bezier = easeInOutBack,0.68,-0.55,0.265,1.55

    animation = global        ,1, 3.00, default
    # animation = border        ,1, 3.00, easeOutQuint
    # animation = borderangle   ,1, 20.00, linear, loop

    animation = windowsIn     ,1, 1.50, quick, slide top
    animation = windowsOut    ,1, 1.50, quick, slide top
    animation = windowsMove   ,1, 1.50, quick
    animation = fadeIn        ,1, 1.73, almostLinear
    animation = fadeOut       ,1, 1.46, almostLinear
    animation = fade          ,1, 3.03, quick

    animation = layersIn      ,1, 1.50, quick, slide bottom
    animation = layersOut     ,1, 1.50, quick, slide bottom

    # animation = fadeLayersIn  ,1, 1.79, almostLinear
    # animation = fadeLayersOut ,1, 1.39, almostLinear
    animation = workspaces    ,1, 1.50, easeInOutCubic, slidefade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling.
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    middle_click_paste = false
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    font_family = JetBrainsMono Nerd Font
}

group {
    col.border_active = rgba(FFFCF02f)
    col.border_inactive = rgba(000000a1)
    col.border_locked_active = rgba(5E409Ded)
    col.border_locked_inactive = rgba(000000a1)

  groupbar {
    text_color = rgb(FFFCF0)
    # text_color_inactive = rgba(CECDC3df)
    # text_color_locked_active = rgba(CECDC3df)
    # text_color_locked_inactive = rgba(CECDC3df)
    font_size = 12
    font_weight_active = normal
    font_weight_inactive = thin

    gradients = true
    col.active = rgba(100F0Fed)
    col.inactive = rgba(00000081)
    col.locked_active = rgba(5E409Ded)
    col.locked_inactive = rgba(00000081)

    height = 24
    indicator_height = none
    rounding = none
    gradient_rounding = 4

    gaps_out = 1
    keep_upper_gap = false
  }
}
