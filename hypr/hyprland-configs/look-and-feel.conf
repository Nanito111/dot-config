#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

$border_active_color = rgb(b27547)
$border_inactive_color = rgb(452b17)

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 4,4,4,4

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $border_active_color
    col.inactive_border = $border_inactive_color

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 2
        sharp = true
        offset = 0, 0
        color = rgba(000000FF)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        new_optimizations = true
        ignore_opacity = true
        xray = false
        size = 5
        passes = 2
        brightness = 0.6
        noise = 0.2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint   , 0.23, 1.00, 0.32, 1.00
    bezier = easeInOutCubic , 0.65, 0.05, 0.36, 1.00
    bezier = linear         , 0.00, 0.00, 1.00, 1.00
    bezier = almostLinear   , 0.50, 0.50, 0.75, 1.00
    bezier = quick          , 0.15, 0.00, 0.10, 1.00
    bezier = easeOutBack    , 0.68,-0.55, 0.27, 1.55
    bezier = easeInBack     , 0.60,-0.28, 0.74, 0.05
    bezier = easeInOutBack  , 0.68,-0.55, 0.27, 1.55
    bezier = easeOutCirc    , 0.08, 0.82, 0.17, 1.00

    animation = global          ,1, 3.00, default
    # animation = border        ,1, 3.00, easeOutQuint
    # animation = borderangle   ,1, 20.00, linear, loop

    animation = windowsIn       ,1, 1.50, quick, slide top
    animation = windowsOut      ,1, 1.50, quick, slide top
    animation = windowsMove     ,1, 1.50, quick
    animation = fadeIn          ,1, 1.73, almostLinear
    animation = fadeOut         ,1, 1.46, almostLinear
    animation = fade            ,1, 3.03, quick

    animation = layersIn        ,1, 1.50, quick, popin
    animation = layersOut       ,1, 1.50, quick, popin

    # animation = fadeLayersIn  ,1, 1.79, almostLinear
    # animation = fadeLayersOut ,1, 1.39, almostLinear
    animation = workspaces      ,1, 1.50, quick, slide
    animation = specialWorkspace,1, 1.50, almostLinear, fade
    animation = zoomFactor      ,1, 1.60, easeOutCirc
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling.
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    middle_click_paste = false
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    font_family = Hurmit Nerd Font
}

group {
    col.border_active = $border_active_color
    col.border_inactive = $border_inactive_color
    col.border_locked_active = rgb(5E409D)
    col.border_locked_inactive = rgb(24193D)

  groupbar {
    text_color = rgb(100F0F)
    text_color_inactive = $border_active_color
    text_color_locked_active = rgb(100F0F)
    text_color_locked_inactive = rgb(5E409D)
    font_size = 12
    font_weight_active = normal
    font_weight_inactive = thin

    gradients = true
    col.active = $border_active_color
    col.inactive = rgb(000000)
    col.locked_active = rgb(5E409D)
    col.locked_inactive = rgb(000000)

    height = 18
    indicator_height = none
    rounding = none
    gradient_rounding = 8

    gaps_in = 0
    gaps_out = 4
    keep_upper_gap = false
  }
}
