# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1,1920x1080@165,0x0,1
monitor=DVI-D-1,1920x1080@60,auto-left,1,transform,1

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:DVI-D-1

xwayland {
  force_zero_scaling = true
}


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = nautilus
$appLauncher = fuzzel
$colorPicker = hyprpicker -a -n
$screenshot = hyprshot --clipboard-only
$screenshot-region = $screenshot -m region
$screenshot-window = $screenshot -m window
$screenshot-monitor = $screenshot -m output -m active


#################
### AUTOSTART ###
#################

# workaround for gtk4 bug with cursor size
execr-once = gsettings set org.gnome.desktop.interface cursor-size 32

execr-once = uwsm app -- easyeffects --gapplication-service
execr-once = ./.config/hypr/checkupdates.fish
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,32
env = XCURSOR_THEME,Colloid-cursors
env = TERMINAL,$terminal
env = QT_QPA_PLATFORMTHEME,qt6ct #theme for Qt apps

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4,8,4,8

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(CECDC3)
    col.inactive_border = rgb(575653)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 30
        # sharp = false
        offset = 0, 0
        color = rgba(0000007A)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        new_optimizations = true
        ignore_opacity = true
        xray = false
        size = 5
        passes = 2
        brightness = 0.6
        noise = 0.07
    }
}

# blur layers
layerrule = blur, gtk-layer-shell
layerrule = ignorezero, gtk-layer-shell
layerrule = blur, launcher
layerrule = ignorezero, launcher

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling.
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 60
    repeat_delay = 300

    follow_mouse = 2

    sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }


###################
### KEYBINDINGS ###
###################

binds {
  scroll_event_delay = false
}

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, C, exec, uwsm app -- $terminal
bind = $mainMod, Y, exec, /.config/hypr/checkupdates.fish
bind = $mainMod SHIFT, C, exec, uwsm app -- $colorPicker

# screenshot binds
bind = $mainMod, S, exec, uwsm app -- $screenshot-region
bind = $mainMod SHIFT, S, exec, uwsm app -- $screenshot-window
bind = $mainMod LEFT_CONTROL, S, exec, uwsm app -- $screenshot-monitor

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, escape, exit,
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, uwsm app -- $appLauncher
bind = $mainMod, G, pseudo, # dwindle
bind = $mainMod, F, togglesplit, # dwindle

# system binds
bind = $mainMod, P, exec, uwsm app -- hyprlock
bind = $mainMod SHIFT, P, exec, systemctl suspend

# Move focus with mainMod + vim move keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window with mainMod shift + vim move keys
bind = $mainMod shift, H, movewindow, l
bind = $mainMod shift, L, movewindow, r
bind = $mainMod shift, K, movewindow, u
bind = $mainMod shift, J, movewindow, d

# Move floting window with mainMod left-control + vim move keys
$move_amount = 30
binde = $mainMod LEFT_CONTROL, H, moveactive, -$move_amount 0
binde = $mainMod LEFT_CONTROL, L, moveactive, $move_amount 0
binde = $mainMod LEFT_CONTROL, K, moveactive, 0 -$move_amount
binde = $mainMod LEFT_CONTROL, J, moveactive, 0 $move_amount

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, A, togglespecialworkspace, magic
bind = $mainMod SHIFT, A, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = $mainMod SHIFT, N, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+
bindel = $mainMod SHIFT, B, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-
bindel = $mainMod SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = $mainMod, N, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, B, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Zoom stuff
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor `hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}'`
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor `hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}'`
bind = $mainMod, mouse:274, exec, hyprctl -q keyword cursor:zoom_factor 1

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# windowrule = nofocus,title:Wine System Tray,pinned:0,floating:0
# windowrule = stayfocused,class:steam_app_(.*),title:Mirror's Edge™ Catalyst,xwayland:1,content:game
# windowrule = tile, class:(.*)(SweetHome3D), title:(.*)(Sweet Home 3D), xwayland:0, floating:0
# game rules
windowrule = fullscreen, class:^steam_app_\d+$
windowrule = monitor HDMI-A-1,class:^steam_app_\d+$
windowrule = workspace 10,class:^steam_app_\d+$
windowrule = content game, class:^steam_app_\d+$
windowrule = noblur, class:^steam_app_\d+$
windowrule = opaque, class:^steam_app_\d+$

windowrule = fullscreen, class:gamescope
windowrule = monitor HDMI-A-1, class:gamescope
windowrule = workspace 10, class:gamescope
windowrule = content game, class:gamescope
windowrule = noblur, class:gamescope
windowrule = opaque, class:gamescope
windowrule = stayfocused, class:gamescope

workspace = 10, border:false, rounding:false, decorate:false, monitor:HDMI-A-1, persistent:false
