font=Hurmit Nerd Font:size=20:weight=normal
use-bold=no
line-height=32
fields=name,generic,exec,categories,keywords,filename
lines=8
icon-theme=WhiteSur-grey-dark
filter-desktop=yes

anchor=bottom
y-margin=30
width=40
horizontal-pad=30
vertical-pad=25
inner-pad=25

prompt=" >  "
placeholder="search app or launch command"
match-mode=fuzzy

launch-prefix="uwsm app -- "
keyboard-focus="on-demand"

[colors]
# color base tone black
background=100F0Fe1
# color base tone 200
match=CECDC3ff
# color base tone 200
selection-match=CECDC3ff

# transparent
selection=00000000

#1b110f 950
#2d1a19 900
#412322 850
#552d2b 800
#6b3635 700
#81403f 600
#984A49 500
#a86360 400
#b87c79 300
#c79592 200
#d6afac 150
#e4c9c7 100
#f2e4e3 50

# color accent tone 700
placeholder=6b3635ff
# color accent tone 400
border=a8636090
# color accent tone 800
text=552d2bff
# color accent tone 300
selection-text=b87c79ff
# color accent tone 300
prompt=b87c79ff
# color accent tone 300
input=b87c79ff
# color accent tone 600
counter=81403fff

[border]
radius=8
width=1

[key-bindings]
execute=Return KP_Enter Control+m
execute-input=Shift+Return Shift+KP_Enter Control+Shift+m
custom-1=Mod1+h
custom-10=Mod1+Shift+h
