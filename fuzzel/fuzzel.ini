font=JetBrainsMono Nerd Font:size=18:weight=light
use-bold=no
line-height=32
fields=name,generic,exec,categories,keywords,filename
lines=8
icon-theme=WhiteSur-grey
filter-desktop=yes

anchor=bottom
y-margin=30
width=40
horizontal-pad=30
vertical-pad=25
inner-pad=25

prompt="   "
placeholder="search app or launch command"
match-mode=fuzzy

launch-prefix="uwsm app -- "
keyboard-focus="on-demand"


