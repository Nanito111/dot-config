[main]
include = "~/.config/fuzzel/colors.ini"

font=JetBrainsMono Nerd Font:size=20:weight=light, Noto Color Emoji:size=20
use-bold=no
line-height=32
fields=name,generic,exec,categories,keywords,filename
lines=8
icon-theme=Colloid-Grey-Dark
filter-desktop=yes

anchor=bottom
y-margin=200
width=40
horizontal-pad=30
vertical-pad=30
inner-pad=30

prompt=" >  "
placeholder="search app or launch command"
match-mode=fuzzy

launch-prefix="uwsm app -- "

[border]
radius=17
width=2

[key-bindings]
execute=Return KP_Enter Control+m
execute-input=Shift+Return Shift+KP_Enter Control+Shift+m
custom-1=Mod1+h
custom-10=Mod1+Shift+h
