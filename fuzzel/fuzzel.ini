font=Hurmit Nerd Font:size=20:weight=normal
use-bold=no
line-height=32
fields=name,generic,exec,categories,keywords,filename
lines=8
icon-theme=WhiteSur-grey-dark
filter-desktop=yes

anchor=bottom
y-margin=30
width=40
horizontal-pad=30
vertical-pad=25
inner-pad=25

prompt=" >  "
placeholder="search app or launch command"
match-mode=fuzzy

launch-prefix="uwsm app -- "
keyboard-focus="on-demand"

# #1c130b 950
# #301f12 900
# #452b17 850
# #5b381c 800
# #724521 700
# #895225 600
# #a2602a 500
# #b27547 400
# #c08b64 300
# #cea281 200
# #dcb89f 150
# #e8d0be 100
# #f4e7de 50

[colors]
# color base tone black
background=100F0Fe1
# color base tone 200
match=CECDC3ff
# color base tone 200
selection-match=CECDC3ff

# transparent
selection=00000000

# color accent tone 700
placeholder=724521ff
# color accent tone 400
border=b2754790
# color accent tone 800
text=5b381cff
# color accent tone 300
selection-text=c08b64ff
# color accent tone 300
prompt=c08b64ff
# color accent tone 300
input=c08b64ff
# color accent tone 600
counter=895225ff

[border]
radius=8
width=1

[key-bindings]
execute=Return KP_Enter Control+m
execute-input=Shift+Return Shift+KP_Enter Control+Shift+m
custom-1=Mod1+h
custom-10=Mod1+Shift+h
