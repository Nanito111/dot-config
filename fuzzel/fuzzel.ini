font=Bitcount Single:size=20:weight=normal
use-bold=no
line-height=32
fields=name,generic,exec,categories,keywords,filename
lines=8
icon-theme=WhiteSur-grey-dark
filter-desktop=yes

anchor=bottom
y-margin=30
width=40
horizontal-pad=30
vertical-pad=25
inner-pad=25

prompt=" >  "
placeholder="search app or launch command"
match-mode=fuzzy

launch-prefix="uwsm app -- "
keyboard-focus="on-demand"


[colors]
# color base tone black
background=100F0Fe1
# color base tone 200
match=CECDC3ff
# color base tone 200
selection-match=CECDC3ff

# transparent
selection=00000000

# color accent tone 700
placeholder=8E6B01ff
# color accent tone 400
border=D0A21590
# color accent tone 800
text=664D01ff
# color accent tone 300
selection-text=DFB431ff
# color accent tone 300
prompt=DFB431ff
# color accent tone 300
input=DFB431ff
# color accent tone 600
counter=AD8301ff

[border]
radius=8
width=1

[key-bindings]
execute=Return KP_Enter Control+m
execute-input=Shift+Return Shift+KP_Enter Control+Shift+m
custom-1=Mod1+h
custom-10=Mod1+Shift+h
