include other.conf
# Include *.conf files from all subdirs of kitty.d inside the kitty config dir
globinclude kitty.d/**/*.conf
# Include the *contents* of all env vars starting with KITTY_CONF_
envinclude KITTY_CONF_*

font_size 14.0

cursor_shape block

hide_window_decorations no
window_padding_width 0 0

tab_activity_symbol "  "

repaint_delay 30
sync_to_monitor no

background_blur 1
background_opacity 0.92

shell_integration no-cursor

enabled_layouts grid,tall,fat

map ctrl+alt+t goto_layout tall
map ctrl+alt+f goto_layout fat
map ctrl+alt+g goto_layout grid


# BEGIN_KITTY_THEME
# Kanagawa_dragon
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="GoMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
